{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}

<h2>Вход</h2>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Имя пользователя"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Пароль"
        required
    >

    <br><br>

    <button type="submit">Войти</button>

</form>

<br>

<a href="{{ url_for('register') }}">
    Нет аккаунта? Зарегистрироваться
</a>

<br><br>

<a href="{{ url_for('index') }}">На главную</a>

{% endblock %}
