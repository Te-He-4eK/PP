{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<h2>Регистрация</h2>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Имя пользователя"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Пароль"
        required
    >

    <br><br>

    <button type="submit">Зарегистрироваться</button>

</form>

<br>

<a href="{{ url_for('login') }}">
    Уже есть аккаунт? Войти
</a>

<br><br>

<a href="{{ url_for('index') }}">На главную</a>

{% endblock %}
